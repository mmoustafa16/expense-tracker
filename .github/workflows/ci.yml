name: CI

on:
  pull_request:
  push:
    branches:
      - cursor/compose-screens-1e11

permissions:
  contents: read

jobs:
  gradle:
    name: test and assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Run unit tests and assemble the debug app
        run: ./gradlew test :android:app:assembleDebug
